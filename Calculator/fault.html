<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <style>
        .screen{
            width: 30vw;
            height: 10vh;
            background-color: aqua;
            text-align: right;
            font-size: 25px;
        }
        .buttons{
            
            margin-top: 10px;
            width: 30vw;
            height: 50vh;
            background-color: azure;
            display: grid;
            gap: 10px;
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        .buttons button{
            font-size: large;
            border-radius: 7px;
            cursor: pointer;
        }
        .buttons button:hover{
            border: 0.5px solid black;
            background-color: rgb(187, 199, 199);
        }
    </style>
    <div class="screen" id = "screen1"></div>
    <div class="buttons">
        <button id="7" onclick = "seven()">7</button>
        <button id="8" onclick = "eight()">8</button>
        <button id="9" onclick = "nine()">9</button>
        <button id="cancel" onclick = "cancel()">CE</button>
        <button id="4" onclick = "four()">4</button>
        <button id="5" onclick = "five()">5</button>
        <button id="6" onclick = "six()">6</button>
        <button id="divide" onclick = "divide()">/</button>
        <button id="1" onclick = "one()">1</button>
        <button id="2" onclick = "two()">2</button>
        <button id="3" onclick = "three()">3</button>
        <button id="multiply" onclick = "multiply()">*</button>
        <button id="submit" onclick = "result()">=</button>
        <button id="0" onclick = "zero()">0</button>
        <button id="minus" onclick = "minus()">-</button>
        <button id="plus" onclick = "sum()">+</button>
    </div>
    <script src="faulty.js"></script>
</body>
</html>
